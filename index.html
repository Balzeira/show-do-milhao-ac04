<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Oficial - Show do Milhão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-ranking">
        <h1>🏆 Ranking Oficial - Show do Milhão</h1>
        <p>Resultados em tempo real consultados do banco online</p>

        <button id="btn-atualizar" class="btn-atualizar">🔄 Atualizar Ranking</button>

        <div class="tabela-container">
            <table class="tabela-ranking">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jogador</th>
                        <th>Prêmio</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody id="ranking-corpo">
                    <tr>
                        <td colspan="4" style="text-align:center;">Carregando dados...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer>
            <p>Desenvolvido para a Atividade Contínua (AC04) - Algoritmos e Programação</p>
        </footer>
    </div>

    <!-- 1. Biblioteca oficial do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. O seu ficheiro de script atualizado -->
    <script src="script.js"></script>
</body>
</html>
